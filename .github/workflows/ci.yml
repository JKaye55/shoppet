name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API
        run: dotnet restore ShoppetAPI/ShoppetAPI.csproj
      - name: Build API
        run: dotnet build ShoppetAPI/ShoppetAPI.csproj --configuration Release --no-restore
      - name: Test API smoke tests
        run: dotnet test ShoppetAPI.Tests/ShoppetAPI.Tests.csproj --configuration Release --no-build

  maui-android:
    name: MAUI Android build (runner-supported)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore mobile project
        run: dotnet restore ShoppetApp/ShoppetApp.csproj
      - name: Build mobile (Android)
        run: dotnet build ShoppetApp/ShoppetApp.csproj -f net10.0-android --configuration Release --no-restore
