name: Mobile and API build

on:
  push:
    branches:
      - fix/mobile-community-polish
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API
        run: dotnet build ShoppetAPI/ShoppetAPI.csproj --configuration Debug

      - name: Restore MAUI workload
        run: dotnet workload restore ShoppetApp/ShoppetApp.csproj

      - name: Build MAUI Windows target
        run: dotnet build ShoppetApp/ShoppetApp.csproj --configuration Debug --framework net10.0-windows10.0.19041.0
